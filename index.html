body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:13px;padding:20px;}

.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.kpis{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:150px;}
.kpi .l{color:var(--sub);font-size:11px;margin-bottom:3px;}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.tblcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto;}
table{border-collapse:collapse;width:100%;white-space:nowrap;}
thead th{position:sticky;top:0;background:#fafbfc;border-bottom:1px solid var(--border);padding:9px 8px;font-size:11px;color:var(--sub);font-weight:600;text-align:right;cursor:pointer;user-select:none;z-index:2;}
thead th:hover{color:var(--accent);}
th.l,td.l{text-align:left;}
th.grp{border-right:1px solid var(--border);}
tbody td{padding:8px;border-bottom:1px solid #f0f2f5;text-align:right;font-variant-numeric:tabular-nums;}
tbody tr.main:hover{background:#f7faff;cursor:pointer;}
.grpbar{display:inline-block;width:4px;height:26px;border-radius:2px;vertical-align:middle;margin-right:8px;}
.cname{font-weight:600;}
.ccode{color:var(--sub);font-size:11px;margin-left:6px;}
.up{color:var(--up);font-weight:600;}
.down{color:var(--down);font-weight:600;}
.dim{color:#c1c7cf;}
.tr-empty{background:#fcfcfd;}
.tr-empty td{color:#b9c0c9;font-style:normal;}
.ninst{font-size:11px;color:var(--sub);}
tr.detail td{background:#fbfcfe;padding:0;border-bottom:2px solid var(--border);}
.dtwrap{padding:12px 18px;}
.dttitle{font-size:12px;color:var(--sub);margin-bottom:8px;}
table.inst{white-space:normal;}
table.inst th{position:static;background:#f4f6f8;padding:6px 8px;font-size:11px;}
table.inst td{padding:7px 8px;font-size:12px;white-space:normal;max-width:430px;line-height:1.55;}
.tier{display:inline-block;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:1px;}
sup.cm{color:#b06;font-weight:700;font-size:9px;margin-left:1px;cursor:help;}
sup.cm.d{color:#0a7d7d;}
.impl{font-size:10px;color:var(--sub);font-weight:400;margin-top:1px;}
tr.cons-row td{background:#fffdf2;}
.ups{display:block;font-size:11px;font-weight:600;opacity:.85;}
.srctag{display:inline-block;margin-left:6px;font-size:10px;color:#9aa3ad;border:1px solid var(--border);border-radius:3px;padding:0 4px;}
/* 估值核心依据：默认显示120字摘要，点击展开全文 */
.assum{color:#37474f;cursor:pointer;display:block;}
.assum.fold::after{content:'展开';display:inline-block;margin-left:6px;font-size:10px;color:#1256a0;border-bottom:1px dashed #1256a0;}
.assum:hover{color:#1256a0;}
.assfull{color:#37474f;display:block;white-space:pre-wrap;}
table.inst td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:1px;}
.b-out{background:#f0f1f3;color:#98a1ac;}
.b-in{background:#e8f0fe;color:#2563eb;}
.b-cons{background:#fff3bf;color:#8a6100;}
.foot{color:var(--sub);font-size:11px;line-height:1.8;margin-top:16px;}
.stale{color:#c77700;font-size:11px;}
.emptymsg{padding:14px;text-align:center;color:var(--sub);}
@media (max-width:900px){body{padding:10px;font-size:12px;}}

const SYM = {USD:'$',CNY:'¥',KRW:'₩',TWD:'NT$'};
const DEC = {USD:2,CNY:2,KRW:0,TWD:0};
let WINDOW = 90;
let SCOPE = 'head';            // core | head | all
let expanded = new Set();
let sortKey = null, sortAsc = false;

const TIER = {core:{t:'核心投行',bg:'#e3f0ff',fg:'#1256a0'},
              global:{t:'外资',bg:'#f0e9ff',fg:'#6a34b5'},
              cn:{t:'中资头部',bg:'#fff1e6',fg:'#b35c00'},
              cn2:{t:'国内券商',bg:'#fff8e1',fg:'#8a6d1a'},
              other:{t:'其他',bg:'#f1f3f5',fg:'#6b7280'},
              cons:{t:'共识',bg:'#fff3bf',fg:'#8a6100'}};
function scopeOk(i){
  if(SCOPE==='all') return true;
  if(SCOPE==='core') return i.tier==='core';
  return i.tier==='core'||i.tier==='global'||i.tier==='cn'||i.tier==='cn2';
}

function cutoff(){ const d = new Date(D.updatedAt.replace(/-/g,'/')); d.setDate(d.getDate()-WINDOW); return d; }
function inWindow(dateStr){ if(!dateStr) return false; return new Date(dateStr.replace(/-/g,'/')) >= cutoff(); }

// 窗口内聚合（tier='cons' 的 Nasdaq 共识行不参与平均，仅在逐机构 EPS 缺失时兜底）
function agg(c){
  const insts = c.insts.filter(i=>scopeOk(i) && inWindow(i.date));
  const consRow = c.insts.find(i=>i.tier==='cons');
  const consEps = consRow?consRow.eps:[null,null,null];
  // lib = 当前机构范围下的在库总数（不限窗口），用于在窗口内机构过少时提示还有存量数据
  const lib = c.insts.filter(i=>i.tier!=='cons' && scopeOk(i)).length;
  const r = {n:insts.length, eps:[null,null,null], tp:null, nEps:[0,0,0], nTp:0, lib,
             fromCons:[false,false,false], tpFromCons:false};
  for(let y=0;y<3;y++){
    const vals = insts.map(i=>i.eps[y]).filter(v=>v!=null);
    r.nEps[y]=vals.length;
    if(vals.length) r.eps[y]=vals.reduce((a,b)=>a+b,0)/vals.length;
    else if(consEps[y]!=null){ r.eps[y]=consEps[y]; r.fromCons[y]=true; }
  }
  const tps = insts.map(i=>i.tp).filter(v=>v!=null);
  r.nTp = tps.length;
  if(tps.length) r.tp = tps.reduce((a,b)=>a+b,0)/tps.length;
  else if(c.consTp!=null){ r.tp=c.consTp; r.tpFromCons=true; }   // 东财一致预期目标价兜底（A股）
  return r;
}
// 共识兜底标记：ᶜ = 该值取自市场一致预期（Nasdaq / 东财）
function consMark(flag, title){ return flag?`<sup class="cm" title="${title}">ᶜ</sup>`:''; }
// 推算标记：ᵈ = 由已知指标推算（PE 由现价÷EPS；目标价由研报文本摘录）
function derivMark(flag, title){ return flag?`<sup class="cm d" title="${title}">ᵈ</sup>`:''; }
// 目标价隐含估值倍数：目标价 ÷ 各年 EPS
function implPeTxt(impl){
  if(!impl) return '';
  const s=[0,1,2].filter(k=>impl[k]!=null).map(k=>`${2026+k}E ${impl[k]}x`);
  return s.length?`隐含 ${s.join(' / ')}`:'';
}

function fmt(v,cur,forceDec){
  if(v==null||isNaN(v)) return '—';
  const d = forceDec!=null?forceDec:DEC[cur];
  return v.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v){ if(v==null||isNaN(v)) return '—'; return (v>0?'+':'')+(v*100).toFixed(1)+'%'; }
function cls(v){ return v==null?'':(v>=0?'up':'down'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const COLS = [
  {k:'name',t:'名称',l:1},
  {k:'eps0',t:'EPS 2026E'},{k:'eps1',t:'EPS 2027E'},{k:'eps2',t:'EPS 2028E'},
  {k:'pe0',t:'PE 2026E'},{k:'pe1',t:'PE 2027E'},{k:'pe2',t:'PE 2028E'},
  {k:'price',t:'最新股价'},
  {k:'tp',t:'平均目标价'},{k:'upside',t:'目标价空间'},
  {k:'mktcap',t:'市值(亿美元)'},
  {k:'n',t:'窗口内机构'},
];

function rowVal(c,k,a){
  const cur=c.currency;
  switch(k){
    case 'name': return null;
    case 'eps0': return a.eps[0]; case 'eps1': return a.eps[1]; case 'eps2': return a.eps[2];
    case 'pe0': return a.eps[0]!=null?c.price/a.eps[0]:null;
    case 'pe1': return a.eps[1]!=null?c.price/a.eps[1]:null;
    case 'pe2': return a.eps[2]!=null?c.price/a.eps[2]:null;
    case 'price': return c.price;
    case 'tp': return a.tp;
    case 'upside': return a.tp!=null&&c.price?a.tp/c.price-1:null;
    case 'mktcap': return c.mktcapUsd?c.mktcapUsd/1e8:null;
    case 'n': return a.n;
  }
}

function render(){
  // meta
  const fx=D.fx;
  document.getElementById('meta').textContent = `更新时间 ${D.updatedAt}（北京时间）`;
  document.getElementById('legend').innerHTML = groups().map(g=>

  // KPI
  const withTp = D.companies.map(c=>({c,a:agg(c)})).filter(x=>x.a.tp!=null&&x.c.price);
  const avgUp = withTp.length? withTp.reduce((s,x)=>s+x.a.tp/x.c.price-1,0)/withTp.length : null;
  const aggAll = D.companies.map(c=>({c,a:agg(c)}));
  const totalReports = aggAll.reduce((s,x)=>s+x.a.n,0);
  const totalInsts = D.companies.reduce((s,c)=>s+c.insts.filter(i=>i.tier!=='cons'&&scopeOk(i)).length,0);
  const instEpsInsts = D.companies.reduce((s,c)=>s+c.insts.filter(i=>i.tier!=='cons'&&i.hasEps&&scopeOk(i)).length,0);
  const consFill = aggAll.filter(x=>x.a.fromCons.some(Boolean)).length;
  document.getElementById('kpis').innerHTML = [
    {l:`窗口内机构（${WINDOW}天·等权）`, v:totalReports},

    {l:'平均目标价空间（等权）', v:avgUp!=null?pct(avgUp):'—', c:cls(avgUp)},
    {l:'汇率', v:`CNY ${fx.USDCNY??'—'} / KRW ${fx.USDKRW??'—'} / TWD ${fx.USDTWD??'—'}`, s:1},
  ].map(k=>`<div class="kpi"><div class="l">${k.l}</div><div class="v ${k.s?'':(k.c||'')}" style="${k.s?'font-size:13px;font-weight:600':''}">${k.v}</div></div>`).join('');

  // rows

      return (sortAsc?1:-1)*(vx-vy);
    });
  }
  let html='';
  for(const {c,a} of list){
    const chg = c.prev? (c.price/c.prev-1):null;
    const empty = a.n===0;
    html += `<tr class="main ${empty?'tr-empty':''}" data-code="${c.code}">

      <td class="${empty?'dim':''}">${fmt(a.eps[0],c.currency)}${consMark(a.fromCons[0],'逐机构EPS缺失，取市场一致预期')}</td>
      <td class="${empty?'dim':''}">${fmt(a.eps[1],c.currency)}${consMark(a.fromCons[1],'逐机构EPS缺失，取市场一致预期')}</td>
      <td class="${empty?'dim':''}">${fmt(a.eps[2],c.currency)}${consMark(a.fromCons[2],'逐机构EPS缺失，取市场一致预期')}</td>
      <td class="${empty?'dim':''}">${a.eps[0]!=null?fmt(c.price/a.eps[0],c.currency,1)+consMark(a.fromCons[0],'PE 基于市场一致预期EPS'):'—'}</td>
      <td class="${empty?'dim':''}">${a.eps[1]!=null?fmt(c.price/a.eps[1],c.currency,1)+consMark(a.fromCons[1],'PE 基于市场一致预期EPS'):'—'}</td>
      <td class="${empty?'dim':''}">${a.eps[2]!=null?fmt(c.price/a.eps[2],c.currency,1)+consMark(a.fromCons[2],'PE 基于市场一致预期EPS'):'—'}</td>
      <td>${fmt(c.price,c.currency)}${chg!=null?` <span class="${cls(chg)}" style="font-size:11px">${pct(chg)}</span>`:''}${c.priceFresh?'':' <span class="stale" title="实时接口失败，回退Excel快照价">⚠</span>'}</td>
      <td class="${empty?'dim':''}" title="${a.tpFromCons?'窗口内无机构目标价，取东方财富一致预期目标价':''}">${fmt(a.tp,c.currency)}${a.nTp?`<span class="ninst"> (${a.nTp})</span>`:''}${a.tpFromCons?consMark(true,'窗口内无机构目标价，取东财一致预期目标价'):''}</td>
      <td class="${cls(a.tp!=null&&c.price?a.tp/c.price-1:null)} ${empty?'dim':''}">${a.tp!=null&&c.price?pct(a.tp/c.price-1):'—'}</td>
      <td>${c.mktcapUsd?Math.round(c.mktcapUsd/1e8).toLocaleString():'—'}</td>
      <td class="${empty?'dim':''}">${a.n}${a.n?`<span class="ninst"> EPS${a.nEps[0]}/TP${a.nTp}</span>`:''}${a.lib>a.n?`<span class="ninst" title="窗口外还有存量机构预测，展开明细可见"> 库内${a.lib}</span>`:''}</td>
    </tr>`;
    if(expanded.has(c.code)) html += detailRow(c);
  }
  document.getElementById('tbody').innerHTML = html;

  document.querySelectorAll('tr.main').forEach(tr=>tr.onclick=()=>{
    const code=tr.dataset.code;
    expanded.has(code)?expanded.delete(code):expanded.add(code);
    render();
  });
  document.querySelectorAll('#thead th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k;sortAsc=false;}
    render();
  });
}

function detailRow(c){
  const cut = cutoff();
  const rows = c.insts.map(i=>{
    if(i.tier!=='cons' && !scopeOk(i) && SCOPE!=='all') return '';
    if(SCOPE==='all'&&i.tier==='other') {}
    const isCons = i.tier==='cons';
    const inw = isCons ? true : inWindow(i.date);
    const style = inw?'':'opacity:.42;';
    const tinfo = TIER[i.tier]||TIER.other;
    const eps = i.eps.map(e=>`<td class="num ${inw?'':'dim'}">${e!=null?fmt(e,c.currency):'—'}</td>`).join('');
    // PE：机构原始披露优先；缺失则用「现价÷该机构EPS」推算，打 ᵈ 标记
    const peCalc = i.peCalc||[false,false,false];
    const pe = [0,1,2].map(y=>{
      const v = (i.pe&&i.pe[y]!=null)?i.pe[y]:(i.eps[y]!=null&&c.price?c.price/i.eps[y]:null);
      const isCalc = v!=null && !isCons && (peCalc[y] || !(i.pe&&i.pe[y]!=null));
      return `<td class="num ${inw?'':'dim'}" title="${isCalc?'由现价 ÷ 该机构 EPS 推算':''}">${v!=null?fmt(v,c.currency,1):'—'}${derivMark(isCalc,'由现价 ÷ 该机构 EPS 推算，非机构披露值')}</td>`;
    }).join('');
    const srcTxt = {excel:'Excel底稿',eastmoney:'东方财富',web:'联网检索',nasdaq:'Nasdaq共识',
                    'eastmoney-cons':'东财一致预期',
                    'eastmoney+excel':'Excel+东财','web+excel':'Excel+检索',
                    'eastmoney+web':'东财+检索','eastmoney+excel+web':'三源合并',
                    'web+eastmoney':'东财+检索','excel+eastmoney':'Excel+东财',
                    'excel+web':'Excel+检索'}[i.src]||i.src;
    const tpCalc = i.tpSrc==='text';
    const impl = implPeTxt(i.implPe)
      + (i.implPeCons?' <span title="该机构未披露EPS，分母为市场共识EPS，混合口径仅供参考" style="cursor:help">ᶜ</span>':'');
    const tpHtml = i.tp!=null
      ? fmt(i.tp,c.currency)+`<span class="ups ${cls(i.tp/c.price-1)}">${i.tp&&c.price?pct(i.tp/c.price-1):''}</span>`
        + derivMark(tpCalc,'该目标价从研报原文文本中抽取，非结构化字段')
        + (impl?`<div class="impl">${impl}</div>`:'')
      : '—';
    const note = [i.rating, i.researcher, i.note].filter(x=>x&&x!=='-').join(' · ');
    const badge = isCons
      ? `<span class="badge b-cons">全年基准</span>`
      : `<span class="badge ${inw?'b-in':'b-out'}">${inw?WINDOW+'天内':'窗口外'}</span>${i.date?'':'<span class="badge b-out">无日期</span>'}`;
    let lastCol = note||'—';
    const ass = (i.assumption||'').trim();
    if(ass){
      const short = ass.length>120 ? ass.slice(0,120)+'…' : ass;
      lastCol = (note?note+'<br>':'')
        + `<span class="assum${ass.length>120?' fold':''}" title="点击展开/收起全文">${esc(short)}</span>`
        + `<span class="assfull" style="display:none">${esc(ass)}</span>`;
    }
    if(isCons){
      const rng = [0,1,2].filter(k=>i.hi&&i.hi[k]!=null)
        .map(k=>`${2026+k}E ${fmt(i.lo[k],c.currency)}~${fmt(i.hi[k],c.currency)}`).join('；');
      lastCol = (i.assumption||'') + (rng?`<br>分析师区间：${rng}`:'');
    }
    return `<tr class="${isCons?'cons-row':''}" style="${style}">
      <td class="l" style="font-weight:600">
        <span class="tier" style="background:${tinfo.bg};color:${tinfo.fg}">${tinfo.t}</span>${i.inst}
        ${badge}
      </td>
      ${eps}${pe}
      <td class="num ${inw?'':'dim'}">${tpHtml}</td>
      <td class="num" style="color:var(--sub)">${i.date??(isCons?'全年':'—')}</td>
      <td style="color:var(--sub);white-space:pre-wrap">${lastCol}<span class="srctag">${srcTxt}</span></td>
    </tr>`;
  }).join('');
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="dtwrap">
    <div class="dttitle">${c.name}（${c.code}）· 机构预测明细 · 股价 ${fmt(c.price,c.currency)} ${SYM[c.currency]}（${c.priceSource}${c.priceTime?' '+c.priceTime:''}）${c.cover?`　<span style="font-weight:400;color:var(--sub)">东方财富口径 ${c.cover} 家机构覆盖，本看板收录 ${c.instTotal-0} 行</span>`:''}</div>
    <table class="inst"><thead><tr>
      <th class="l">预测机构</th><th>EPS 2026E</th><th>EPS 2027E</th><th>EPS 2028E</th>
      <th>PE 2026E</th><th>PE 2027E</th><th>PE 2028E</th><th>目标价</th><th>预测时间</th><th class="l">估值核心依据（点击展开）</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div></td></tr>`;
}

function groups(){
  const seen={}, out=[];
  for(const c of D.companies){ if(!seen[c.group]){seen[c.group]=1;out.push({name:c.group,bg:c.groupBg,fg:c.groupFg});} }
  return out;
}

document.getElementById('seg').addEventListener('click',e=>{
  if(e.target.dataset.w){WINDOW=+e.target.dataset.w;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b===e.target));
    render();}
});
document.getElementById('seg2').addEventListener('click',e=>{
  if(e.target.dataset.s){SCOPE=e.target.dataset.s;
    document.querySelectorAll('#seg2 button').forEach(b=>b.classList.toggle('on',b===e.target));
    render();}
});
// 点击估值依据 → 摘要/全文切换（明细表重绘后事件用委托，无需重绑）
document.addEventListener('click', e => {
  const el = e.target.closest('.assum');
  if(!el) return;
  const full = el.parentNode.querySelector('.assfull');
  if(!full) return;
  const open = el.dataset.open === '1';
  if(open){                       // 收起
    el.textContent = el.dataset.short;
    el.classList.add('fold'); full.style.display='none'; el.dataset.open='0';
  }else{                          // 展开
    el.dataset.short = el.dataset.short || el.textContent;
    el.textContent = full.textContent;
    el.classList.remove('fold'); full.style.display='none'; el.dataset.open='1';
  }
});

document.getElementById('foot').innerHTML = `
  <b>口径说明</b>：①EPS/目标价取窗口内各机构预测的算术平均（"取中枢"）；②PE = 实时股价 ÷ 窗口内EPS均值，空缺保持为空；③各股票保留原始计价货币，不换算；④市值为实时股价×总股本÷实时汇率（A股总市值取自行情接口）。<br>
  <b>机构范围</b>：核心投行=全球前十投行+伯恩斯坦（高盛/摩根士丹利/摩根大通/美银/花旗/富国/巴克莱/德银/UBS/汇丰/伯恩斯坦）；头部机构=核心投行+其他外资大行/精品行+国内头部券商；全部机构=再含其他券商。<br>
  <b>数据源</b>：Excel底稿（人工维护，含估值假设）· 东方财富研报库（A股逐机构三年EPS/PE/目标价，自动抓取）· 同花顺F10盈利预测（A股逐机构三年EPS与研报摘要）· 联网检索（非A股公司各投行公开报道的目标价/评级，多为财经媒体转述，EPS公开渠道不可得故多为空）。更新Excel后下一次自动刷新生效。<br>
  <b>推算值</b>（一律打标，非机构披露）：<sup class="cm d">ᵈ</sup> = 由已知指标推算 —— PE 取「现价 ÷ 该机构 EPS」；目标价若标 ᵈ 则为研报原文文本抽取。<sup class="cm">ᶜ</sup> = 市场一致预期兜底（窗口内无任何机构数据时启用）。<b>目标价不能由 EPS×PE 推算</b>：东方财富的 PE 是「报告发布日股价 ÷ 当年 EPS」的当期 PE，并非目标 PE（例：中际旭创群益证券 09-23，EPS 30.13×PE 31.0=934，为其发布日股价，而报告目标价为 1200），故该式只能还原股价。<br>

  行情源：新浪财经（A股/美股/汇率）· Naver（韩股，含总股本）· 台湾证交所（台股）· 腾讯行情（A股总市值）。本看板仅供内部研究参考，不构成投资建议。<br>
  <b>EPS 口径</b>：①表格中带 <sup class="cm">ᶜ</sup> 标记的数字取自 <b>Nasdaq 市场一致预期</b>（多分析师年度预测的算术平均，每周自动刷新），用于填补该标的窗口内无公开逐机构 EPS 的空缺——逐机构三年 EPS 通常只见于彭博/Wind 付费终端，属公开免费渠道的客观限制；②A股标的的 EPS 全部来自东方财富逐家券商研报，为真实逐机构数据；③逐机构 EPS 先按报告发布日期取最新，同一机构多源冲突时取最新非空值。`;
render();
